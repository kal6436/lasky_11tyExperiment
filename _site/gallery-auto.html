<!doctype html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" 
           content="width=device-width, 
           user-scalable=no, 
           initial-scale=1.0, 
           maximum-scale=1.0, 
           minimum-scale=1.0">
     <meta http-equiv="X-UA-Compatible" 
           content="ie=edge">
     <title>Kylie's First 11ty Project!</title>
     <link rel="stylesheet" href="css/style.css">
     <script type="module" src="js/is-land.js"></script>
</head>
<body>
    

    <p>Press a button to see the process photos of my digital art.</p>


<is-land on:visible>
  <div id="gallery" v-scope="{ active: 'all' }">
    <div class="filters">
      <button @click="active = 'all'" :class="{ on: active === 'all' }" :aria-pressed="active === 'all'">All</button>
      
      <button @click="active = 'finishdrawing'" :class="{ on: active === 'finishdrawing' }" :aria-pressed="active === 'finishdrawing'">finishdrawing</button>
      
      <button @click="active = 'flatdrawing'" :class="{ on: active === 'flatdrawing' }" :aria-pressed="active === 'flatdrawing'">flatdrawing</button>
      
      <button @click="active = 'sketches'" :class="{ on: active === 'sketches' }" :aria-pressed="active === 'sketches'">sketches</button>
      
    </div>
    <p aria-live="polite">Showing: <span v-text="active"></span></p>
    
    <section class="topic" v-show="active === 'all' || active === 'finishdrawing'">
      <h3>finishdrawing</h3>
      <div class="row">
        
        <figure>
          <img src="img/finishdrawing/ASqueakChibiFinish.png" alt="Cleanly colored drawing of a cute puppy character with their arms in the air">
          <figcaption>ASqueakChibiFinish</figcaption>
        </figure>
        
        <figure>
          <img src="img/finishdrawing/andilooChibiFinish_10.24.26.png" alt="A cleanly colored drawing of a sabertooth cat character holding their tail curled into a ball shape">
          <figcaption>andilooChibiFinish 10.24.26</figcaption>
        </figure>
        
        <figure>
          <img src="img/finishdrawing/misfortuneChibiFinish_8.3.26.png" alt="Cleanly colored drawing of a gothic cat character sitting and drawing on an ipad">
          <figcaption>misfortuneChibiFinish 8.3.26</figcaption>
        </figure>
        
        <figure>
          <img src="img/finishdrawing/veillPaymentArt_6.28.26.png" alt="Portrait of a fox-like character">
          <figcaption>veillPaymentArt 6.28.26</figcaption>
        </figure>
        
      </div>
    </section>
    
    <section class="topic" v-show="active === 'all' || active === 'flatdrawing'">
      <h3>flatdrawing</h3>
      <div class="row">
        
        <figure>
          <img src="img/flatdrawing/ASqueakChibiFlat.png" alt="Colored drawing of a cute puppy character with their arms in the air">
          <figcaption>ASqueakChibiFlat</figcaption>
        </figure>
        
        <figure>
          <img src="img/flatdrawing/andilooChibiFlat_10.24.26.png" alt="A colored drawing of a sabertooth cat character holding their tail curled into a ball shape">
          <figcaption>andilooChibiFlat 10.24.26</figcaption>
        </figure>
        
        <figure>
          <img src="img/flatdrawing/misfortuneChibiFlat_8.3.26.png" alt="Colored drawing of a gothic cat character sitting and drawing on an ipad">
          <figcaption>misfortuneChibiFlat 8.3.26</figcaption>
        </figure>
        
      </div>
    </section>
    
    <section class="topic" v-show="active === 'all' || active === 'sketches'">
      <h3>sketches</h3>
      <div class="row">
        
        <figure>
          <img src="img/sketches/ASqueakChibiSketch.png" alt="Uncolored sketch of a cute puppy character with their arms in the air">
          <figcaption>ASqueakChibiSketch</figcaption>
        </figure>
        
        <figure>
          <img src="img/sketches/andilooChibiSketch_10.24.26.png" alt="Two uncolored sketches one on the left of a sabertooth cat character standing with a basket, and on the right the character holding their tail curled into a ball shape">
          <figcaption>andilooChibiSketch 10.24.26</figcaption>
        </figure>
        
        <figure>
          <img src="img/sketches/misfortuneChibiSketch_8.3.26.png" alt="Two uncolored sketches of a gothic cat character the sketch on the left is them sitting and drawing on an ipad and on the right is them sitting, looking at the camera holding a switch">
          <figcaption>misfortuneChibiSketch 8.3.26</figcaption>
        </figure>
        
      </div>
    </section>
    
  </div>

  <template data-island>
    <script type="module">
      import { createApp } from './js/petite-vue.js'
      createApp().mount('#gallery')
    </script>
  </template>
</is-land>

    <strong>Page last updated:</strong>

  <time class="fmt-date" datetime="2026-11-12T12:40:52-05:00">2026-11-12T12:40:52-05:00</time>

&middot;
<strong>Site last built:</strong>
<time class="fmt-date" datetime="2026-11-18T02:53:20.215Z">2026-11-18T02:53:20.215Z</time>

<is-land on:visible>
  <template data-island>
    <script type="module">
      const fmt = new Intl.DateTimeFormat(undefined, {
        dateStyle: "medium",
        timeStyle: "short"
      });
      document.querySelectorAll("time.fmt-date").forEach((el) => {
        el.textContent = fmt.format(new Date(el.getAttribute("datetime")));
      });
    </script>
  </template>
</is-land>
    
</body>
</html>
